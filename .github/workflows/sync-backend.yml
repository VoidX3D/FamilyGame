name: Sync backend branch

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/sync-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-backend
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish server folder to backend
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          split_sha="$(git subtree split --prefix=server HEAD)"

          # The deployment branch must stay backend-only.
          if git ls-tree -r --name-only "$split_sha" | grep -Eq '^(web|\.github)/'; then
            echo "Refusing to publish: frontend files found in backend tree."
            exit 1
          fi
          git cat-file -e "$split_sha:package.json"
          git cat-file -e "$split_sha:index.js"

          # Always add a commit on top of the current backend tip. Wispbyte runs
          # `git pull` on restart, so the branch must advance without force.
          if git ls-remote --exit-code --heads origin backend >/dev/null 2>&1; then
            git fetch origin backend
            parent="$(git rev-parse origin/backend)"
            sync_commit="$(
              git commit-tree "$split_sha^{tree}" \
                -p "$parent" \
                -m "Sync backend from main@${GITHUB_SHA::7}"
            )"
          else
            sync_commit="$split_sha"
          fi

          # A plain push keeps the history a straight line, so every clone can
          # fast-forward. If something has committed to the branch by hand,
          # fall back to a force push rather than leaving the deploy broken.
          if ! git push origin "$sync_commit:refs/heads/backend"; then
            echo "::warning::The backend branch was not a fast-forward. Force pushing it."
            git push --force origin "$sync_commit:refs/heads/backend"
            echo "::warning::A clone that still has the old history must run: git fetch origin backend && git branch --force backend origin/backend"
          fi

      - name: Tell the host how to update
        if: success()
        run: |
          echo "The server copy of the backend branch is at ${{ github.sha }}."
          echo "On the hosting machine, update it with:"
          echo "  git fetch origin backend && git branch --force backend origin/backend"
          echo "or run 'npm run deploy:update' in the repository."
